openapi: '3.0.3'

info:
  title: Video Upload & Transcription API
  version: 1.0.0
  description: API for uploading videos, transcribing them using OpenAI Whisper, and retrieving stored transcripts.

servers:
  - url: http://localhost:3010/api/v0

paths:
  /upload:
    post:
      summary: Upload a video for transcription
      description: Uploads a video file, processes it with OpenAI Whisper, and stores the transcript.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  format: binary
                  description: The video file to be uploaded.
      responses:
        200:
          description: Video uploaded successfully and transcribed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  videoId:
                    type: integer
                  transcript:
                    type: string
        400:
          description: No video file provided or invalid request.
        500:
          description: Internal server error (processing failed).
        default:
          description: Unexpected error.
  /video/{id}:
    get:
      summary: Get a specific lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Returns the lesson data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  videoId:
                    type: string
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      lessonPlan:
                        type: string
                      quiz:
                        type: string
                      notes:
                        type: string
        404:
          description: Lesson not found
        500:
          description: Internal server error
  /lesson:
    post:
      summary: Add a new lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                videoId:
                  type: string
                lessonPlan:
                  type: string
                quiz:
                  type: string
                notes:
                  type: string
      responses:
        201:
          description: Lesson added successfully
        500:
          description: Internal server error
    get:
      summary: Get all lessons
      responses:
        200:
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    videoId:
                      type: string
                    data:
                      type: object
                      properties:
                        name:
                          type: string
                        lessonPlan:
                          type: string
                        quiz:
                          type: string
                        notes:
                          type: string
        500:
          description: Internal server error
  /lesson/{id}:
    get:
      summary: Get a specific lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Returns the lesson data
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  videoId:
                    type: string
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      lessonPlan:
                        type: string
                      quiz:
                        type: string
                      notes:
                        type: string
        404:
          description: Lesson not found
        500:
          description: Internal server error
    put:
      summary: Update an existing lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonInput'
      responses:
        '200':
          description: Lesson updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  lessonId:
                    type: string
        '404':
          description: Lesson not found
        '500':
          $ref: '#/components/schemas/Error'
  /ai/gen:
    post:
      summary: Generate lesson content sercurely using OpenAI
      description: Accepts structured data (e.g. transcript and requestType) and constructs prompt server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transcript
              properties:
                transcript:
                  type: string
                  description: Raw transcript to base the response on
                requestType:
                  type: string
                  enum: [lessonPlan, quiz, notes]
                  description: Type of AI output to Generate
      responses:
        200:
          description: generated content from OpenAI
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: string
        400:
          description: bad input
        500:
          description: Server or OpenAI Error
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string